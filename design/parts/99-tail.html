
<footer class="colophon">
  <div class="colophon-seal"><span class="seal" style="--size:56px" aria-hidden="true">한지</span></div>
  <div>
    <p class="colophon-line">hanji — thin, strong, and it takes whatever ink you bring.</p>
    <p class="colophon-meta">Tokens, arithmetic and motion vocabulary ported from <span class="t-mono">@hanji/core</span>. Everything marked <span class="tag-new">New</span> or <span class="tag-new tag-prop">Proposed</span> is an extension offered back to the library, not a fork of it. Set in Figtree and DM Mono.</p>
  </div>
</footer>
</div>
</main>

<style>
.colophon{ margin-top:160px; padding-top:40px; border-top:2px solid var(--fg); display:grid; grid-template-columns:120px 1fr; gap:32px; align-items:start }
.colophon-line{ margin:0 0 8px; font-weight:600; font-size:20px; letter-spacing:-.02em }
.colophon-meta{ margin:0; max-width:640px; color:var(--fg-dim); font-size:14px; line-height:1.6 }
</style>

<script>
/* ==========================================================================
   Page chrome: appearance controls, the contents rail, scroll spy, cascades.
   ========================================================================== */
(function(){
  const { $, $$ } = H;

  /* appearance controls — built from the same kit the chapters document */
  const segTheme = H.segmented($('#seg-theme'), v => H.set('theme', v));
  const segDensity = H.segmented($('#seg-density'), v => H.set('density', v));
  const segMotion = H.segmented($('#seg-motion'), v => H.set('motion', v));
  segTheme.select(H.state.theme); segDensity.select(H.state.density); segMotion.select(H.state.motion);
  H.on('theme', v => segTheme.select(v));
  H.on('motion', v => segMotion.select(v));
  H.on('density', v => segDensity.select(v));

  const grid = $('#acc-grid'); const names = Object.keys(H.accents);
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  function paintAccents(){
    const dark = H.themes[H.state.theme].isDark;
    grid.innerHTML = names.map(n => `<button class="acc-opt" role="radio" aria-checked="${n===H.state.accent}" data-acc="${n}"><i style="background:${H.accents[n][dark?'dark':'light']}"></i>${cap(n)}</button>`).join('');
    $('#acc-name').textContent = cap(H.state.accent);
  }
  paintAccents();
  const pop = H.popover($('#acc-btn'), $('#acc-pop'), { align:'end' });
  grid.addEventListener('click', e => { const b = e.target.closest('[data-acc]'); if (!b) return; H.set('accent', b.dataset.acc); });
  H.on('accent', paintAccents); H.on('theme', paintAccents);

  /* bar hairline appears once the page moves */
  const bar = $('#bar');
  const onScroll = () => bar.classList.toggle('scrolled', scrollY > 8);
  addEventListener('scroll', onScroll, { passive:true }); onScroll();

  /* spring glyphs in spec notes */
  $$('[data-curve]').forEach(el => { el.outerHTML = H.curveSVG(el.dataset.curve); });

  /* chapter indexes fill themselves from their entries */
  $$('.chapter-index[data-auto]').forEach(ol => {
    const ch = ol.closest('section.chapter');
    ol.innerHTML = $$('.entry[id]', ch).map(e => `<li><span>${e.querySelector('.entry-num')?.textContent.trim() || ''}</span><a href="#${e.id}">${(e.querySelector('.entry-title')?.childNodes[0]?.textContent || e.id).trim()}</a></li>`).join('');
  });

  /* contents rail, built from the chapters on the page */
  const rail = $('#rail');
  const chapters = $$('section.chapter');
  let html = '<ul class="rail-list"><span class="rail-ind" id="rail-ind"></span>';
  chapters.forEach(ch => {
    const num = ch.dataset.num || ''; const title = ch.dataset.title || ch.querySelector('.chapter-title')?.textContent || '';
    const entries = $$('.entry[id]', ch);
    html += `<li class="rail-ch" data-ch="${ch.id}"><a href="#${ch.id}"><span class="n">${num}</span><span>${title}</span></a>`;
    if (entries.length){
      html += '<div class="rail-sub"><ul>' + entries.map(e => `<li><a href="#${e.id}" data-entry="${e.id}">${(e.querySelector('.entry-title')?.childNodes[0]?.textContent || e.id).trim()}</a></li>`).join('') + '</ul></div>';
    }
    html += '</li>';
  });
  html += '</ul><div class="rail-foot">Every specimen on this page is live. Change the paper, accent, density or motion above and it repaints in place.</div>';
  rail.innerHTML = html;

  const ind = $('#rail-ind');
  let curCh = null, curEntry = null;
  function moveInd(){
    const a = curEntry ? rail.querySelector(`a[data-entry="${curEntry}"]`) : (curCh ? rail.querySelector(`.rail-ch[data-ch="${curCh}"] > a`) : null);
    if (!a){ ind.style.opacity = 0; return; }
    const lr = rail.querySelector('.rail-list').getBoundingClientRect(); const r = a.getBoundingClientRect();
    ind.style.setProperty('--y', (r.top - lr.top + 4) + 'px'); ind.style.height = (r.height - 8) + 'px'; ind.style.opacity = 1;
  }
  function spy(){
    const y = innerHeight * .3; let ch = null, en = null;
    for (const c of chapters){ if (c.getBoundingClientRect().top <= y) ch = c; }
    if (ch){ for (const e of $$('.entry[id]', ch)){ if (e.getBoundingClientRect().top <= y) en = e.id; } }
    const chId = ch ? ch.id : null;
    if (chId !== curCh){
      $$('.rail-ch', rail).forEach(li => li.classList.toggle('on', li.dataset.ch === chId));
      curCh = chId;
      setTimeout(moveInd, 30); setTimeout(moveInd, 420);
    }
    if (en !== curEntry){
      $$('.rail-sub a', rail).forEach(a => a.classList.toggle('on', a.dataset.entry === en));
      curEntry = en; moveInd();
      const a = en && rail.querySelector(`a[data-entry="${en}"]`);
      if (a){ const rr = rail.getBoundingClientRect(), ar = a.getBoundingClientRect(); if (ar.bottom > rr.bottom - 40 || ar.top < rr.top + 40) rail.scrollTo({ top: rail.scrollTop + ar.top - rr.top - rr.height/2, behavior: H.reduced() ? 'auto' : 'smooth' }); }
    }
  }
  let ticking = false;
  addEventListener('scroll', () => { if (!ticking){ ticking = true; requestAnimationFrame(() => { spy(); ticking = false; }); } }, { passive:true });
  spy();

  /* chapter rules draw in when they arrive */
  const rules = $$('.chapter-rule');
  if ('IntersectionObserver' in window && !document.documentElement.classList.contains('static') && !H.reduced()){
    rules.forEach(r => r.style.transform = 'scaleX(0)');
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.style.transition = H.reduced() ? 'none' : 'transform 900ms var(--ease-out)'; e.target.style.transform = 'scaleX(1)'; io.unobserve(e.target); } }), { threshold:.5 });
    rules.forEach(r => io.observe(r));
  }

  H.cascade();
  H.emit('ready');
})();
</script>
</body>
</html>
