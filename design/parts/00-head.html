<!doctype html>
<html lang="en" data-theme="paper" data-accent="scarlet" data-density="cozy" data-motion="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hanji — design system</title>
<meta name="description" content="hanji: a performance-first component system. Tokens, atoms, components and motion, live in every paper and ink.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&text=%ED%95%9C%EC%A7%80%EB%8B%B4%EC%9D%B8&display=swap" rel="stylesheet">
<style id="theme-vars"></style>
<style>
/* ==========================================================================
   hanji — base. Every value here is a hanji token, or a declared proposal.
   Colour vars are written per theme by the runtime (#theme-vars) from the
   same arithmetic as @hanji/core (blend / contrastOn / deriveAccent).
   ========================================================================== */
:root{
  /* fallback = paper × scarlet, so the page never paints unthemed */
  --bg:#f0ece3; --bg-soft:#f7f5f0; --surface:#fbfaf8; --surface-2:#ffffff;
  --line:rgba(0,0,0,.1); --fg:#16130f; --fg-dim:#5c5853; --fg-mute:#83807a;
  --accent:#b81f18; --on-accent:#ffffff; --accent-soft:#e8d2c8;
  --danger:#c4321f; --scrim:#000000; --on-scrim:#f4f2ef;
  --fg-rgb:22,19,15; --accent-rgb:184,31,24; --bg-rgb:240,236,227;
  --seal:#b5241b;

  /* spacing (hanji s1–s12) × density */
  --d:1;
  --s1:calc(4px*var(--d)); --s2:calc(8px*var(--d)); --s3:calc(12px*var(--d));
  --s4:calc(16px*var(--d)); --s5:calc(20px*var(--d)); --s6:calc(24px*var(--d));
  --s8:calc(32px*var(--d)); --s10:calc(40px*var(--d)); --s12:calc(48px*var(--d));
  --gutter:var(--s5); --hairline:1px; --touch:44px;

  /* radius (hanji) */
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:20px; --r-xl:28px; --r-pill:999px;

  /* motion (hanji) — springs become CSS linear() curves at runtime */
  --ease-out:cubic-bezier(.33,1,.68,1);
  --dur-fast:180ms; --dur-base:260ms; --dur-slow:400ms;
  --ease-snappy:var(--ease-out); --dur-snappy:320ms;
  --ease-gentle:var(--ease-out); --dur-gentle:380ms;
  --ease-bouncy:var(--ease-out); --dur-bouncy:600ms;
  --ease-snappy-settle:var(--ease-out); --dur-snappy-settle:260ms;
  --ease-gentle-settle:var(--ease-out); --dur-gentle-settle:320ms;
  --ease-bouncy-settle:var(--ease-out); --dur-bouncy-settle:220ms;
  --stagger:24ms; --rise:12px; --press:.97; --press-opacity:.75;
  --travel:1;

  /* type */
  --font:'Figtree',ui-sans-serif,system-ui,sans-serif;
  --mono:'DM Mono',ui-monospace,'SFMono-Regular',monospace;
  --seal-font:'Noto Serif KR',serif;

  /* page metrics (documentation page, not component tokens) */
  --rail:236px; --bar:60px; --page-pad:56px; --measure:1180px;
}
html[data-density="compact"]{ --d:.7 }
html[data-motion="reduced"]{
  /* hanji MotionPolicy 'reduced': feedback survives, decoration dies,
     travel becomes a fade, nothing runs longer than durations.fast */
  --ease-snappy:var(--ease-out); --ease-gentle:var(--ease-out); --ease-bouncy:var(--ease-out);
  --ease-snappy-settle:var(--ease-out); --ease-gentle-settle:var(--ease-out); --ease-bouncy-settle:var(--ease-out);
  --dur-snappy:120ms; --dur-gentle:160ms; --dur-bouncy:160ms;
  --dur-snappy-settle:120ms; --dur-gentle-settle:160ms; --dur-bouncy-settle:160ms;
  --dur-base:180ms; --dur-slow:180ms; --stagger:0ms; --travel:0;
}

*,*::before,*::after{ box-sizing:border-box }
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; scroll-padding-top:calc(var(--bar) + 24px) }
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:400 15px/1.55 var(--font); letter-spacing:0;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  font-feature-settings:"ss01" off;
  transition:background-color var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out);
}
::selection{ background:rgba(var(--accent-rgb),.22) }
button,input,select,textarea{ font:inherit; color:inherit; letter-spacing:inherit }
button{ cursor:pointer; background:none; border:0; padding:0; -webkit-tap-highlight-color:transparent }
a{ color:inherit }
img,svg{ display:block }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px }
.sr{ position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap }

/* icons: one family, 1.5 stroke, round joins — through the adapter */
.ic{ width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round }
.ic.s16{ width:16px; height:16px } .ic.s18{ width:18px; height:18px } .ic.s24{ width:24px; height:24px } .ic.s14{ width:14px; height:14px }

/* squircle: hanji draws continuous corners (smoothing .72). Where the
   platform can, so do we; elsewhere a circular radius is the fallback. */
.sq{ border-radius:var(--r-md) }
@supports (corner-shape: squircle){ .sq,.plate,.hj-btn,.hj-field,.hj-surface{ corner-shape:superellipse(1.6) } }

/* ---------- type roles (hanji typeScale) ---------- */
.t-display{ font-weight:700; font-size:34px; line-height:38px; letter-spacing:-.5px }
.t-title{ font-weight:700; font-size:22px; line-height:26px; letter-spacing:-.3px }
.t-heading{ font-weight:600; font-size:19px; line-height:24px; letter-spacing:-.2px }
.t-subheading{ font-weight:600; font-size:18px; line-height:23px; letter-spacing:-.2px }
.t-body{ font-weight:500; font-size:15px; line-height:20px }
.t-sub{ font-weight:400; font-size:12.5px; line-height:17px }
.t-label{ font-weight:600; font-size:11px; line-height:14px; letter-spacing:.4px }
.t-eyebrow{ font-weight:600; font-size:10px; line-height:12px; letter-spacing:1.6px; text-transform:uppercase }
.t-mono{ font-family:var(--mono); font-weight:500; font-size:12.5px; line-height:17px; letter-spacing:.2px; font-variant-numeric:tabular-nums }
.dim{ color:var(--fg-dim) } .mute{ color:var(--fg-mute) } .acc{ color:var(--accent) }
.num{ font-variant-numeric:tabular-nums }

/* ---------- press: feedback in one frame, release on a spring ---------- */
.hj-press{ transition:transform var(--dur-snappy) var(--ease-snappy), opacity var(--dur-fast) var(--ease-out); will-change:transform }
.hj-press:active{ transform:scale(var(--press)); transition-duration:70ms,70ms }
.hj-press.row-press:active{ transform:none; opacity:var(--press-opacity) }

/* ==========================================================================
   PAGE SHELL
   ========================================================================== */
.topbar{
  position:fixed; inset:0 0 auto 0; height:var(--bar); z-index:50;
  display:flex; align-items:center; gap:20px; padding:0 24px 0 28px;
  background:var(--bg);
  border-bottom:1px solid transparent;
  transition:border-color var(--dur-base) var(--ease-out), background-color var(--dur-base) var(--ease-out);
}
.topbar.scrolled{ border-bottom-color:var(--line) }
.brand{ display:flex; align-items:center; gap:10px; text-decoration:none; width:calc(var(--rail) - 28px) }
.brand-word{ font-weight:700; font-size:19px; letter-spacing:-.04em }
.brand-ver{ font:500 11px/1 var(--mono); color:var(--fg-mute); padding-top:2px }
.bar-tools{ margin-left:auto; display:flex; align-items:center; gap:18px }
.bar-group{ display:flex; align-items:center; gap:10px }
.bar-label{ font-weight:600; font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:var(--fg-mute) }
.bar-sep{ width:1px; height:22px; background:var(--line) }

.seal{
  --size:30px;
  width:var(--size); height:var(--size); flex:none; display:grid; place-items:center;
  background:var(--seal); color:#fbf3ea; border-radius:calc(var(--size)*.14);
  font:900 calc(var(--size)*.38)/1 var(--seal-font); letter-spacing:-.02em;
  writing-mode:vertical-rl; text-orientation:upright;
  box-shadow:inset 0 0 0 calc(var(--size)*.045) var(--seal), inset 0 0 0 calc(var(--size)*.08) #fbf3ea;
  position:relative; overflow:hidden; user-select:none;
}
.seal::after{ /* the stamp is never perfectly inked */
  content:""; position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; opacity:.5;
  background:
    radial-gradient(circle at 22% 78%, rgba(255,255,255,.35) 0 1.5%, transparent 2.5%),
    radial-gradient(circle at 74% 18%, rgba(255,255,255,.28) 0 1.2%, transparent 2%),
    radial-gradient(circle at 60% 66%, rgba(255,255,255,.22) 0 .8%, transparent 1.6%);
}

.rail{
  position:fixed; top:var(--bar); bottom:0; left:0; width:var(--rail); z-index:40;
  padding:28px 0 40px 28px; overflow-y:auto; scrollbar-width:none;
}
.rail::-webkit-scrollbar{ display:none }
.rail-list{ list-style:none; margin:0; padding:0; position:relative }
.rail-ind{
  position:absolute; left:-28px; top:0; width:3px; height:20px; border-radius:0 3px 3px 0;
  background:var(--accent); transform:translateY(var(--y,0)); opacity:0;
  transition:transform var(--dur-snappy-settle) var(--ease-snappy-settle), height var(--dur-snappy-settle) var(--ease-snappy-settle), opacity var(--dur-fast) var(--ease-out);
}
.rail-ch > a{
  display:grid; grid-template-columns:26px 1fr; align-items:baseline; gap:4px;
  padding:6px 16px 6px 0; text-decoration:none; color:var(--fg-dim);
  font-weight:600; font-size:13.5px; letter-spacing:-.005em;
  transition:color var(--dur-fast) var(--ease-out);
}
.rail-ch > a .n{ font:500 11px/1 var(--mono); color:var(--fg-mute) }
.rail-ch > a:hover, .rail-ch.on > a{ color:var(--fg) }
.rail-sub{
  display:grid; grid-template-rows:0fr; transition:grid-template-rows var(--dur-gentle-settle) var(--ease-gentle-settle);
}
.rail-ch.on .rail-sub{ grid-template-rows:1fr }
.rail-sub > ul{ overflow:hidden; list-style:none; margin:0; padding:0 0 0 30px }
.rail-sub a{
  display:block; padding:4px 12px 4px 0; font-size:12.5px; color:var(--fg-mute); text-decoration:none;
  transition:color var(--dur-fast) var(--ease-out);
}
.rail-sub a:hover, .rail-sub a.on{ color:var(--fg) }
.rail-foot{ margin-top:28px; padding-right:20px; font-size:11.5px; line-height:1.5; color:var(--fg-mute) }

main{ padding:var(--bar) var(--page-pad) 160px calc(var(--rail) + var(--page-pad)); }
.wrap{ max-width:var(--measure) }

/* ---------- chapter opener: the split headline ---------- */
.chapter{ padding-top:128px }
.chapter-head{ margin-bottom:56px }
.chapter-line{
  display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:28px;
}
.chapter-title{ margin:0; font-weight:700; font-size:76px; line-height:.92; letter-spacing:-.045em }
.chapter-rule{ height:2px; background:var(--fg); transform-origin:left center }
.chapter-num{ font:500 76px/.92 var(--font); letter-spacing:-.05em; color:var(--fg-mute); font-variant-numeric:tabular-nums }
.chapter-body{ display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:56px; margin-top:28px; align-items:start }
.chapter-lede{ margin:0; max-width:620px; font-size:18px; line-height:1.55; color:var(--fg-dim); letter-spacing:-.005em }
.chapter-lede b{ color:var(--fg); font-weight:600 }
.chapter-index{ list-style:none; margin:0; padding:0; columns:2; column-gap:20px; font-size:12.5px }
.chapter-index li{ break-inside:avoid; padding:3px 0; display:flex; gap:8px; color:var(--fg-dim) }
.chapter-index li span{ font:500 11px/1.6 var(--mono); color:var(--fg-mute); min-width:34px }
.chapter-index a{ text-decoration:none } .chapter-index a:hover{ color:var(--fg) }

/* ---------- entry: one component, its spec, its live plate ---------- */
.entry{
  display:grid; grid-template-columns:300px minmax(0,1fr); gap:48px;
  padding:44px 0 52px; border-top:1px solid var(--line); position:relative;
}
.entry-num{ font:500 11.5px/1 var(--mono); color:var(--fg-mute); letter-spacing:.02em; margin-bottom:14px; display:flex; gap:10px; align-items:center }
.entry-title{ margin:0 0 10px; font-weight:650; font-weight:600; font-size:28px; line-height:1.1; letter-spacing:-.025em; display:flex; align-items:center; gap:10px; flex-wrap:wrap }
.entry-desc{ margin:0 0 22px; font-size:14.5px; line-height:1.6; color:var(--fg-dim) }
.entry-desc b{ color:var(--fg); font-weight:600 }
.tag-new{
  font:600 9.5px/1 var(--font); letter-spacing:1.4px; text-transform:uppercase;
  color:var(--accent); border:1px solid currentColor; border-radius:4px; padding:4px 5px 3px; transform:translateY(-1px)
}
.tag-prop{ color:var(--fg-mute) }
.spec{ margin:0; display:grid; border-top:1px solid var(--line) }
.spec > div{ display:grid; grid-template-columns:84px 1fr; gap:12px; padding:7px 0; border-bottom:1px solid var(--line); align-items:baseline }
.spec dt{ font-size:11.5px; font-weight:500; color:var(--fg-mute) }
.spec dd{ margin:0; font:400 12px/1.5 var(--mono); color:var(--fg-dim); letter-spacing:0 }
.spec dd b{ font-weight:500; color:var(--fg) }
.motion-note{ margin-top:16px; display:flex; gap:10px; align-items:flex-start; font-size:12.5px; line-height:1.5; color:var(--fg-dim) }
svg.curve{ width:34px; height:22px; flex:none; display:inline-block; vertical-align:middle; color:var(--accent); overflow:visible }
.motion-note .curve{ margin-top:1px }

.plate{
  position:relative; min-height:240px; border-radius:var(--r-lg);
  background:var(--bg-soft); padding:40px 32px 48px;
  display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:28px;
  isolation:isolate;
}
[data-theme="ink"] .plate, html[data-theme="ink"] .plate{ background:var(--bg-soft) }
.plate--top{ align-items:flex-start }
.plate--col{ flex-direction:column }
.plate--stack{ flex-direction:column; align-items:stretch }
.plate--phone{ padding:40px 32px; background:var(--bg-soft) }
.plate-cap{
  position:absolute; left:20px; bottom:16px; right:20px; display:flex; justify-content:space-between; gap:12px;
  font-weight:600; font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:var(--fg-mute); pointer-events:none;
}
.plate-cap .live::before{ content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--accent); margin-right:7px; transform:translateY(-1px) }
.plate-tools{ position:absolute; top:14px; right:14px; display:flex; gap:6px; z-index:2 }
.plate-btn{
  height:28px; padding:0 10px; border-radius:var(--r-pill); display:inline-flex; align-items:center; gap:6px;
  font-size:12px; font-weight:600; color:var(--fg-dim); background:rgba(var(--fg-rgb),.06);
}
.plate-btn:hover{ color:var(--fg); background:rgba(var(--fg-rgb),.1) }
.entry--wide{ grid-template-columns:1fr }
.entry--wide .entry-meta{ display:grid; grid-template-columns:300px minmax(0,1fr); gap:48px; align-items:start }
.entry--wide .entry-meta .spec{ grid-column:2; grid-row:1; }

/* phone stage: a 375pt viewport, not a device frame */
.phone{
  width:360px; height:640px; border-radius:var(--r-xl); background:var(--bg); color:var(--fg);
  border:1px solid var(--line); position:relative; overflow:hidden; flex:none;
  display:flex; flex-direction:column; isolation:isolate;
}
.phone-status{ height:40px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 24px; font:600 13px/1 var(--font); letter-spacing:-.01em }
.phone-status .ind{ display:flex; gap:5px; align-items:center }
.phone-status .ind i{ display:block; width:15px; height:9px; border-radius:2px; border:1.2px solid currentColor; position:relative }
.phone-status .ind i::after{ content:""; position:absolute; inset:1px 4px 1px 1px; background:currentColor; border-radius:1px }
.phone-status .ind b{ display:block; width:3px; height:9px; background:currentColor; border-radius:1px; box-shadow:-5px 2px 0 -0.5px currentColor,-10px 4px 0 -1px currentColor }

/* small layout helpers inside plates */
.row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap }
.col{ display:flex; flex-direction:column; gap:12px }
.stack-l{ display:flex; flex-direction:column; align-items:flex-start; gap:14px }
.swatch-label{ font:500 11px/1.3 var(--mono); color:var(--fg-mute) }

/* ---------- cascade: staggered entrance, one clock per surface ---------- */
html.js [data-cascade]:not(.in) > *{ opacity:0; transform:translateY(calc(var(--rise)*var(--travel))) }
html.js [data-cascade] > *{
  transition:opacity var(--dur-base) var(--ease-out), transform var(--dur-gentle-settle) var(--ease-gentle-settle);
  transition-delay:calc(min(var(--i,0),10) * var(--stagger));
}
html.static [data-cascade] > *{ opacity:1!important; transform:none!important }

/* ==========================================================================
   CORE KIT — the controls the page chrome itself is built from.
   (Documented in chapter 04; defined here so every chapter can use them.)
   ========================================================================== */

/* SegmentedControl — 40 tall, 4 pad, indicator moved by translateX + scaleX */
.hj-seg{
  --h:40px; position:relative; display:inline-flex; align-items:stretch; height:var(--h); padding:4px;
  background:var(--surface); border-radius:var(--r-pill); box-shadow:inset 0 0 0 1px var(--line);
  isolation:isolate; user-select:none;
}
.hj-seg.sm{ --h:32px; padding:3px }
.hj-seg-ind{
  position:absolute; top:4px; bottom:4px; left:4px; width:var(--w,0px); border-radius:var(--r-pill);
  background:var(--accent-soft); z-index:-1; transform-origin:center;
  transform:translateX(var(--x,0px)) scaleX(var(--sx,1));
  transition:transform var(--dur-snappy-settle) var(--ease-snappy-settle), background-color var(--dur-base) var(--ease-out);
}
.hj-seg.sm .hj-seg-ind{ top:3px; bottom:3px; left:3px }
.hj-seg.noanim .hj-seg-ind{ transition:none }
.hj-seg > button{
  position:relative; padding:0 14px; border-radius:var(--r-pill); font-weight:600; font-size:13px; color:var(--fg-dim);
  white-space:nowrap; transition:color var(--dur-fast) var(--ease-out);
}
.hj-seg.sm > button{ padding:0 11px; font-size:12px }
.hj-seg > button[aria-checked="true"]{ color:var(--accent) }
.hj-seg > button:hover{ color:var(--fg) }
.hj-seg > button[aria-checked="true"]:hover{ color:var(--accent) }
.hj-seg > button:focus-visible{ outline-offset:-2px; border-radius:var(--r-pill) }

/* Toggle — 46 × 28 track, 22 knob, clamped snappy spring. The track never
   dips under the finger; the knob stretches toward where it is going. */
.hj-toggle{
  --tw:46px; --th:28px; --k:22px; --pad:3px;
  position:relative; width:var(--tw); height:var(--th); border-radius:var(--r-pill); flex:none;
  background:var(--surface-2); box-shadow:inset 0 0 0 1px var(--line);
  transition:background-color var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out);
}
.hj-toggle::after{
  content:""; position:absolute; top:var(--pad); left:var(--pad); width:var(--k); height:var(--k); border-radius:var(--r-pill);
  background:var(--fg-mute); transform-origin:left center;
  transition:transform var(--dur-snappy-settle) var(--ease-snappy-settle), background-color var(--dur-base) var(--ease-out);
}
.hj-toggle[aria-checked="true"]{ background:var(--accent); box-shadow:inset 0 0 0 1px transparent }
.hj-toggle[aria-checked="true"]::after{ background:var(--on-accent); transform:translateX(calc(var(--tw) - var(--k) - var(--pad)*2)) }
/* press: the knob stretches toward where it is going — by transform (PRINCIPLES §1) */
.hj-toggle:active::after{ transform:scaleX(1.27) }
.hj-toggle[aria-checked="true"]:active::after{ transform:translateX(calc(var(--tw) - var(--k) * 1.27 - var(--pad)*2)) scaleX(1.27) }
.hj-toggle:disabled{ opacity:.4; cursor:not-allowed }
.hj-toggle.sm{ --tw:38px; --th:24px; --k:18px }

/* Button — pill, 3 sizes; primary (accent), ink (proposed), secondary (fg 8%), quiet, danger (tint only) */
.hj-btn{
  --h:44px; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  height:var(--h); padding:0 20px; border-radius:var(--r-pill); font-weight:600; font-size:15px; letter-spacing:-.01em;
  background:var(--accent); color:var(--on-accent); white-space:nowrap; position:relative; overflow:hidden; text-decoration:none;
  transition:transform var(--dur-snappy) var(--ease-snappy), background-color var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out), opacity var(--dur-fast) var(--ease-out);
}
.hj-btn:active{ transform:scale(var(--press)); transition-duration:70ms, var(--dur-base), var(--dur-base), var(--dur-fast) }
.hj-btn.sm{ --h:34px; padding:0 14px; font-size:13.5px; gap:6px }
.hj-btn.lg{ --h:52px; padding:0 26px; font-size:16px }
.hj-btn.block{ display:flex; width:100% }
.hj-btn.ink{ background:var(--fg); color:var(--bg) }
.hj-btn.secondary{ background:rgba(var(--fg-rgb),.08); color:var(--fg) }
.hj-btn.quiet{ background:transparent; color:var(--fg) }
.hj-btn.quiet:hover{ background:rgba(var(--fg-rgb),.06) }
.hj-btn.danger{ background:color-mix(in srgb, var(--danger) 14%, transparent); color:var(--danger) }
.hj-btn:disabled{ opacity:.4; cursor:not-allowed; transform:none }
.hj-btn.icon{ width:var(--h); padding:0 }

/* Popover surface — the one place hanji allows lift (declared proposal) */
.hj-surface{
  background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-md);
  box-shadow:0 1px 0 rgba(var(--fg-rgb),.02), 0 18px 40px -16px rgba(0,0,0,.28);
}
html[data-theme="ink"] .hj-surface, html[data-theme="charcoal"] .hj-surface,
[data-theme="ink"] .hj-surface, [data-theme="charcoal"] .hj-surface{ box-shadow:0 18px 40px -16px rgba(0,0,0,.7) }
.hj-pop{
  position:absolute; z-index:60; padding:6px; min-width:200px;
  opacity:0; transform:scale(.92); transform-origin:var(--ox,top right); pointer-events:none; visibility:hidden;
  transition:opacity var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out), visibility 0s linear var(--dur-fast);
}
.hj-pop.open{
  opacity:1; transform:none; pointer-events:auto; visibility:visible;
  transition:opacity var(--dur-base) var(--ease-out), transform var(--dur-snappy) var(--ease-snappy), visibility 0s;
}

/* accent picker */
.acc-btn{ display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 12px 0 6px; border-radius:var(--r-pill); background:var(--surface); box-shadow:inset 0 0 0 1px var(--line); font-weight:600; font-size:12.5px; color:var(--fg-dim) }
.acc-btn:hover{ color:var(--fg) }
.acc-dot{ width:20px; height:20px; border-radius:50%; background:var(--accent); box-shadow:inset 0 0 0 1px rgba(0,0,0,.08) }
.acc-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:4px; padding:4px; width:236px }
.acc-opt{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 4px 8px; border-radius:var(--r-sm); font-size:11px; font-weight:600; color:var(--fg-dim) }
.acc-opt:hover{ background:rgba(var(--fg-rgb),.05); color:var(--fg) }
.acc-opt i{ width:26px; height:26px; border-radius:50%; display:block; position:relative; transition:transform var(--dur-snappy) var(--ease-snappy) }
.acc-opt[aria-checked="true"] i::after{ content:""; position:absolute; inset:-4px; border-radius:50%; box-shadow:0 0 0 1.5px var(--fg) }
.acc-opt[aria-checked="true"]{ color:var(--fg) }
.acc-opt:active i{ transform:scale(.88) }
.pop-head{ padding:8px 10px 6px; font-weight:600; font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:var(--fg-mute) }

/* Counter — digit roll (hanji Counter: changed digits only, travel .55, ones first) */
.hj-digits{ display:inline-flex; font-variant-numeric:tabular-nums; white-space:pre }
.hj-digits .cl{ position:relative; display:inline-block }
.hj-digits .g{ display:inline-block }
.hj-digits .g.out{ position:absolute; left:0; top:0 }

@media (max-width: 1100px){
  :root{ --rail:0px; --page-pad:28px }
  .rail{ display:none }
  .entry, .entry--wide .entry-meta, .chapter-body{ grid-template-columns:1fr }
  .entry--wide .entry-meta .spec{ grid-column:auto; grid-row:auto }
  .chapter-title,.chapter-num{ font-size:52px }
  .brand{ width:auto }
}
@media (max-width: 720px){
  :root{ --page-pad:16px }
  .topbar{ padding:0 16px; gap:10px } .bar-label,.bar-sep{ display:none } .bar-tools{ gap:8px }
  .brand-ver{ display:none }
  .chapter-title,.chapter-num{ font-size:40px }
  .plate{ padding:32px 16px 44px }
  .phone{ width:100%; max-width:360px }
}

  /* ---- Segmented control wiring ---- */
  H.segmented = function(el, onChange){
    const ind = el.querySelector('.hj-seg-ind') || (() => { const s = document.createElement('span'); s.className = 'hj-seg-ind'; el.prepend(s); return s; })();
    const btns = Array.from(el.querySelectorAll(':scope > button'));
    let first = true;
    function place(){
      const widths = btns.map(b => b.offsetWidth); const base = Math.max.apply(null, widths);
      const i = Math.max(0, btns.findIndex(b => b.getAttribute('aria-checked') === 'true'));
      const left = btns[i].offsetLeft - btns[0].offsetLeft; const w = widths[i];
      // hanji segmented-track: draw at the widest, squeeze with scaleX ≤ 1, translate so the centre lands
      const sx = base ? w / base : 0; const tx = left + w/2 - base/2;
      if (first){ el.classList.add('noanim'); }
      el.style.setProperty('--w', base + 'px'); ind.style.setProperty('--x', tx + 'px'); ind.style.setProperty('--sx', sx);
      if (first){ void ind.offsetWidth; el.classList.remove('noanim'); first = false; }
    }
    btns.forEach((b, i) => {
      b.setAttribute('role', 'radio'); b.classList.add('hj-press');
      b.addEventListener('click', () => select(i, true));
      b.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowLeft'){ e.preventDefault(); const n = (i + (e.key === 'ArrowRight' ? 1 : -1) + btns.length) % btns.length; select(n, true); btns[n].focus(); }
      });
    });
    el.setAttribute('role', 'radiogroup');
    function select(i, user){
      btns.forEach((b, j) => { b.setAttribute('aria-checked', String(j === i)); b.tabIndex = j === i ? 0 : -1; });
      place(); if (user && onChange) onChange(btns[i].dataset.value, i);
      el.dispatchEvent(new CustomEvent('change', { detail:{ value:btns[i].dataset.value, index:i } }));
    }
    const ro = new ResizeObserver(() => place()); ro.observe(el);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { first = true; place(); });
    place();
    return { select: (v) => { const i = btns.findIndex(b => b.dataset.value === v); if (i >= 0) select(i, false); }, place };
  };

  /* ---- Toggle wiring ---- */
  H.toggle = function(el, onChange){
    el.setAttribute('role', 'switch');
    if (!el.hasAttribute('aria-checked')) el.setAttribute('aria-checked', 'false');
    el.addEventListener('click', () => { const on = el.getAttribute('aria-checked') !== 'true'; el.setAttribute('aria-checked', String(on)); onChange && onChange(on); el.dispatchEvent(new CustomEvent('toggle', { detail:{ on } })); });
    return { set:on => el.setAttribute('aria-checked', String(!!on)), get:() => el.getAttribute('aria-checked') === 'true' };
  };

  /* ---- Cascade: stagger 24 ms, capped at 10, rise 12, once per surface ---- */
  H.cascade = function(scope){
    const els = H.$$('[data-cascade]', scope || document);
    els.forEach(c => Array.from(c.children).forEach((ch, i) => ch.style.setProperty('--i', i)));
    if (!('IntersectionObserver' in window) || root.classList.contains('static')){ els.forEach(c => c.classList.add('in')); return; }
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin:'0px 0px -8% 0px' });
    els.forEach(c => io.observe(c));
  };
  H.replay = function(c){ c.classList.remove('in'); void c.offsetWidth; requestAnimationFrame(() => c.classList.add('in')); };

  /* ---- Popover: grows from its anchor ---- */
  H.popover = function(trigger, pop, opts){
    opts = opts || {};
    function close(){ pop.classList.remove('open'); trigger.setAttribute('aria-expanded', 'false'); document.removeEventListener('pointerdown', outside, true); document.removeEventListener('keydown', esc); }
    function outside(e){ if (!pop.contains(e.target) && !trigger.contains(e.target)) close(); }
    function esc(e){ if (e.key === 'Escape'){ close(); trigger.focus(); } }
    function open(){
      const host = pop.offsetParent || document.body;
      const tr = trigger.getBoundingClientRect(), hr = host.getBoundingClientRect();
      const align = opts.align || 'end';
      pop.style.top = (tr.bottom - hr.top + 6) + 'px';
      if (align === 'end'){ pop.style.right = (hr.right - tr.right) + 'px'; pop.style.left = 'auto'; pop.style.setProperty('--ox', 'top right'); }
      else { pop.style.left = (tr.left - hr.left) + 'px'; pop.style.right = 'auto'; pop.style.setProperty('--ox', 'top left'); }
      pop.classList.add('open'); trigger.setAttribute('aria-expanded', 'true');
      setTimeout(() => { document.addEventListener('pointerdown', outside, true); document.addEventListener('keydown', esc); }, 0);
      const f = pop.querySelector('[aria-checked="true"], button'); f && f.focus({ preventScroll:true });
    }
    trigger.setAttribute('aria-haspopup', 'true'); trigger.setAttribute('aria-expanded', 'false');
    trigger.addEventListener('click', () => pop.classList.contains('open') ? close() : open());
    return { open, close };
  };

  writeThemeVars();
  root.dataset.theme = H.state.theme; root.dataset.accent = H.state.accent; root.dataset.density = H.state.density; root.dataset.motion = H.state.motion;
})();
</script>
</head>
